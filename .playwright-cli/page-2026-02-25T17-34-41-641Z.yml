    - generic [ref=e12]:
      - generic [ref=e15]:
        - heading "Dask DataFrame is Fast Now" [level=1] [ref=e16]: Dask DataFrame is Fast Now
        - paragraph [ref=e17]: By Patrick Hoefler
      - generic [ref=e19]:
        - paragraph [ref=e20]:
          - emphasis [ref=e21]:
            - text: This work was engineered and supported by
            - link "Coiled" [ref=e22] [cursor=pointer]:
              - /url: https://coiled.io/?utm_source=dask-blog&utm_medium=dask-expr
            - text: and
            - link "NVIDIA" [ref=e23] [cursor=pointer]:
              - /url: https://www.nvidia.com/
            - text: . Thanks to
            - link "Patrick Hoefler" [ref=e24] [cursor=pointer]:
              - /url: https://github.com/phofl
            - text: and
            - link "Rick Zamora" [ref=e25] [cursor=pointer]:
              - /url: https://github.com/rjzamora
            - text: ", in particular. Original version of this post appears on"
            - link "docs.coiled.io" [ref=e26] [cursor=pointer]:
              - /url: https://docs.coiled.io/blog/dask-dataframe-is-fast.html?utm_source=dask-blog&utm_medium=dask-is-fast
        - figure "Performance Improvements for Dask DataFrames" [ref=e27]:
          - paragraph [ref=e28]:
            - img "Bar chart showing a nearly 20x improvement in Dask DataFrame performance with the addition of Arrow stings, more efficient shufffling, and a query optimizer." [ref=e29]
          - paragraph [ref=e31]:
            - emphasis [ref=e32]: Performance Improvements for Dask DataFrames
        - heading "Intro" [level=2] [ref=e33]
        - paragraph [ref=e34]: Dask DataFrame scales out pandas DataFrames to operate at the 100GB-100TB scale.
        - paragraph [ref=e35]:
          - text: Historically,
          - link "Dask" [ref=e36] [cursor=pointer]:
            - /url: https://www.dask.org/
          - text: was pretty slow compared to other tools in this space (like Spark). Due to a number of improvements focused on performance, it’s now pretty fast (about 20x faster than before). The new implementation moved Dask from getting destroyed by Spark on every benchmark to regularly outperforming Spark on TPC-H queries by a significant margin.
        - paragraph [ref=e37]: Dask DataFrame workloads struggled with many things. Performance and memory usage were commonly seen pain points, shuffling was unstable for bigger datasets, making scaling out hard. Writing efficient code required understanding too much of the internals of Dask.
        - paragraph [ref=e38]: The new implementation changed all of this. Things that didn’t work were completely rewritten from scratch and existing implementations were improved upon. This puts Dask DataFrames on a solid foundation that allows faster iteration cycles in the future.
        - paragraph [ref=e39]: "We’ll go through the three most prominent changes:"
        - list [ref=e40]:
          - listitem [ref=e41]:
            - link "Apache Arrow support" [ref=e42] [cursor=pointer]:
              - /url: "#arrow"
          - listitem [ref=e43]:
            - link "Faster joins" [ref=e44] [cursor=pointer]:
              - /url: "#p2p"
          - listitem [ref=e45]:
            - link "Query optimization" [ref=e46] [cursor=pointer]:
              - /url: "#optimizer"
        - paragraph [ref=e47]: We’ll cover how these changes impact performance and make it easier to use Dask efficiently, even for users that are new to distributed computing. We’ll also discuss plans for future improvements.
        - paragraph
        - 'heading "1. Apache Arrow Support: Efficient String Datatype" [level=2] [ref=e48]'
        - paragraph [ref=e49]: A Dask DataFrame consists of many pandas DataFrames. Historically, pandas used NumPy for numeric data, but Python objects for text data, which are inefficient and blow up memory usage. Operations on object data also hold the GIL, which doesn’t matter much for pandas, but is a catastrophy for performance with a parallel system like Dask.
        - paragraph [ref=e50]:
          - text: The pandas 2.0 release introduced support for general-purpose Arrow datatypes, so
          - link "Dask now uses PyArrow-backed strings by default" [ref=e51] [cursor=pointer]:
            - /url: https://docs.coiled.io/blog/pyarrow-in-pandas-and-dask.html?utm_source=dask-blog&utm_medium=dask-is-fast
          - text: . These are
          - emphasis [ref=e52]: much
          - text: better. PyArrow strings reduce memory usage by up to 80% and unlock multi-threading for string operations. Workloads that previously struggled with available memory now fit comfortably in much less space, and are a lot faster because they no longer constantly spill excess data to disk.
        - figure "Memory Usage of the Legacy DataFrames Compared with Arrow Strings" [ref=e53]:
          - paragraph [ref=e54]:
            - img "Bar chart comparing memory usage (GB) for Dask DataFrame with and without PyArrow strings. Dask DataFrame uses up to 80% less memory with PyArrow strings." [ref=e55]
          - paragraph [ref=e57]:
            - emphasis [ref=e58]: Memory Usage of the Legacy DataFrames Compared with Arrow Strings
        - paragraph
        - heading "2. Faster Joins with a New Shuffle Algorithm" [level=2] [ref=e59]
        - paragraph [ref=e60]: Shuffling is an essential component of distributed systems to enable sorting, joins, and complex group by operations. It is an all-to-all, network-intensive operation that’s often the most expensive component in a workflow. Dask has a new shuffling system, which greatly impacts overall performance, especially on complex, data-intensive workloads.
        - paragraph [ref=e61]:
          - text: A shuffle operation is intrinsically an all-to-all communication operation where every input partition has to provide a tiny slice of data to every output partition. Dask was already using it’s own task-based algorithm that managed to reduce the
          - code [ref=e62]: O(n * n)
          - text: task complexity to
          - code [ref=e63]: O(log(n) * n)
          - text: where
          - code [ref=e64]: "n"
          - text: is the number of partitions. This was a drastic reduction in the number of tasks, but the non-linear scaling ultimately did not allow Dask to process arbitrarily large datasets.
        - paragraph [ref=e65]:
          - text: Dask introduced a new
          - link "P2P (peer-to-peer) shuffle method" [ref=e66] [cursor=pointer]:
            - /url: https://docs.coiled.io/blog/shuffling-large-data-at-constant-memory.html?utm_source=dask-blog&utm_medium=dask-is-fast
          - text: that reduced the task complexity to
          - code [ref=e67]: O(n)
          - text: which scales linearly with the size of the dataset and the size of the cluster. It also incorporates an efficient disk integration which allows easily shuffling datasets which are much larger than memory. The new system is extremely stable and “just works” across any scale of data.
        - figure "Memory Usage of the Legacy Shuffle Compared with P2P" [ref=e68]:
          - paragraph [ref=e69]:
            - img "Line plot of memory usage (GB) over time (seconds) comparing Dask DataFrame with the peer-to-peer shuffling to task-based shuffling. With P2P shuffling, Dask DataFrame memory usage remains consistently low throughout the computation." [ref=e70]
          - paragraph [ref=e72]:
            - emphasis [ref=e73]: Memory Usage of the Legacy Shuffle Compared with P2P
        - paragraph
        - heading "3. Optimizer" [level=2] [ref=e74]
        - paragraph [ref=e75]: Dask itself is lazy, which means that it registers your whole query before doing any actual work. This is a powerful concept that enables a lot of optimizations, but historically Dask wasn’t taking advantage of this knowledge in the past. Dask also did a bad job of hiding internal complexities and left users on their own while navigating the difficulties of distributed computing and running large scale queries. It made writing efficient code painful for non-experts.
        - paragraph [ref=e76]:
          - link "The Dask release in March" [ref=e77] [cursor=pointer]:
            - /url: https://docs.dask.org/en/stable/changelog.html#query-planning
          - text: includes a complete re-implementation of the DataFrame API to support query optimization. This is a big deal. The new engine centers around a query optimizer that rewrites your code to make it more efficient and better tailored to Dask’s strengths. Let’s dive into some optimization strategies, how they make Dask run faster and scale better.
        - paragraph [ref=e78]: "We will start with a couple general-purpose optimizations:"
        - list [ref=e79]:
          - listitem [ref=e80]:
            - link "Column projection" [ref=e81] [cursor=pointer]:
              - /url: "#column-projection"
          - listitem [ref=e82]:
            - link "Filter pushdown" [ref=e83] [cursor=pointer]:
              - /url: "#filter-pushdown"
        - paragraph [ref=e84]: "And then dive into more specific techniques that are tailored to distributed systems generally and Dask more specifically:"
        - list [ref=e85]:
          - listitem [ref=e86]:
            - link "Automatic partition resizing" [ref=e87] [cursor=pointer]:
              - /url: "#partition-resizing"
          - listitem [ref=e88]:
            - link "Trivial merge and join operations" [ref=e89] [cursor=pointer]:
              - /url: "#trivial-merge"
        - paragraph
        - heading "3.1 Column Projection" [level=3] [ref=e90]
        - paragraph [ref=e91]: Most datasets have more columns than needed. Dropping them requires foresight (“What columns will I need for this query? 🤔”) so most people don’t think about this when loading data. This is bad for performance because carrying around lots of excess data slows everything down. Column Projection drops columns as soon as they aren’t needed anymore. It’s a straightforward optimization, but highly beneficial.
        - paragraph [ref=e92]: The legacy implementation always reads all columns from storage and only drops columns when explicitly specified by the user. Simply operating on less data is a big win for performance and memory usage.
        - paragraph [ref=e93]: The optimizer looks at the query and figures out which columns are needed for each operation. It looks at the final step of the query and then works backwards step by step to the data source, injecting drop operations to get rid of unnecessary columns.
        - figure "Only require a subset of columns are needed. Replace doesn’t need access to all columns, so Dask drops unnecessary columns directly in the IO step." [ref=e94]:
          - paragraph [ref=e95]:
            - img "Diagram explaining how column projection works for the Dask DataFrame optimizer." [ref=e96]
          - paragraph [ref=e98]:
            - emphasis [ref=e99]: Only require a subset of columns are needed. Replace doesn’t need access to all columns, so Dask drops unnecessary columns directly in the IO step.
        - paragraph
        - heading "3.2 Filter Pushdown" [level=3] [ref=e100]
        - paragraph [ref=e101]: "Filter pushdown is another general-purpose optimization with the same goal as column projection: operate on less data. The legacy implementation did not reorder filter operations. The new implementation executes filter operations as early as possible while maintaining the same results."
        - paragraph [ref=e102]: The optimizer identifies every filter in the query and looks at the previous operation to see if we can move the filter closer to the data source. It will repeat this until it finds an operation that can’t be switched with a filter. This is a bit harder than column projections, because Dask has to make sure that the operations don’t change the values of the DataFrame. For example, switching a filter and a merge operation is fine (values don’t change), but switching a filter and a replace operation is invalid, because the values might change and rows that would previously have been filtered out now won’t be, or vice versa.
        - figure "Initially, the filter happens after the Dropna, but Dask can execute the filter before Dropna without changing the result. This allows Dask to push the filter into the IO step." [ref=e103]:
          - paragraph [ref=e104]:
            - img "Diagram explaining how filter pushdown (or predicate pushdown) works to reduce the amount of data being processed in the Dask DataFrame query optimizer." [ref=e105]
          - paragraph [ref=e107]:
            - emphasis [ref=e108]: Initially, the filter happens after the Dropna, but Dask can execute the filter before Dropna without changing the result. This allows Dask to push the filter into the IO step.
        - paragraph [ref=e109]: Additionally, if the filter is strong enough then Dask can potentially drop complete files in the IO step. This is a best-case scenario, where an earlier filter brings a huge performance improvement and even requires reading less data from remote storage.
        - paragraph
        - heading "3.3 Automatically Resizing Partitions" [level=3] [ref=e110]
        - paragraph [ref=e111]: "In addition to implementing the common optimization techniques described above, we’ve also improved a common pain point specific to distributed systems generally and Dask users specifically: optimal partition sizes."
        - paragraph [ref=e112]:
          - text: Dask DataFrames consist of many small pandas DataFrames called
          - emphasis [ref=e113]: partitions
          - text: . Often, the number of partitions is decided for you and Dask users are advised to manually “repartition” after reducing or expanding their data (for example by dropping columns, filtering data, or expanding with joins) (see the
          - link "Dask docs" [ref=e114] [cursor=pointer]:
            - /url: https://docs.dask.org/en/stable/dataframe-best-practices.html#repartition-to-reduce-overhead
          - text: ). Without this extra step, the (usually small) overhead from Dask can become a bottleneck if the pandas DataFrames become too small, making Dask workflows painfully slow.
        - paragraph [ref=e115]: "Manually controlling the partition size is a difficult task that we, as Dask users, shouldn’t have to worry about. It is also slow because it requires network transfer of some partitions. Dask DataFrame now automatically does two things to help when the partitions get too small:"
        - list [ref=e116]:
          - listitem [ref=e117]:
            - paragraph [ref=e118]: Keeps the size of each partition constant, based on the ratio of data you want to compute vs. the original file size. If, for example, you filter out 80% of the original dataset, Dask will automatically combine the resulting smaller partitions into fewer, larger partitions.
          - listitem [ref=e119]:
            - paragraph [ref=e120]: Combines too-small partitions into larger partitions, based on an absolute minimum (default is 75 MB). If, for example, your original dataset is split into many tiny files, Dask will automatically combine them.
        - figure "Select two columns that take up 40 MB of memory out of the 200 MB from the whole parquet file." [ref=e121]:
          - paragraph [ref=e122]:
            - img "Diagram representing how column selection can reduce the size of a partition when reading parquet data." [ref=e123]
          - paragraph [ref=e125]:
            - emphasis [ref=e126]: Select two columns that take up 40 MB of memory out of the 200 MB from the whole parquet file.
        - paragraph [ref=e127]: The optimizer will look at the number of columns and the size of the data within those. It calculates a ratio that is used to combine multiple files into one partition.
        - figure "The ratio of 40/200 results in combining five files into a single partition." [ref=e128]:
          - paragraph [ref=e129]:
            - img "Diagram showing how automatic repartitioning works for Dask DataFrame." [ref=e130]
          - paragraph [ref=e132]:
            - emphasis [ref=e133]: The ratio of 40/200 results in combining five files into a single partition.
        - paragraph [ref=e134]: This step is currently limited to IO operations (like reading in a parquet dataset), but we plan to extend it to other operations that allow cheaply combining partitions.
        - paragraph
        - heading "3.4 Trivial Merge and Join Operations" [level=3] [ref=e135]
        - paragraph [ref=e136]: Merge and join operations are typically cheap on a single machine with pandas but expensive in a distributed setting. Merging data in shared memory is cheap, while merging data across a network is quite slow, due to the shuffle operations explained earlier.
        - paragraph [ref=e137]: This is one of the most expensive operations in a distributed system. The legacy implementation triggered a network transfer of both input DataFrames for every merge operation. This is sometimes necessary, but very expensive.
        - figure "Both joins are performed on the same column. The left DataFrame is already properly partitioned after the first join, so Dask can avoid shuffling again with the new implementation." [ref=e138]:
          - paragraph [ref=e139]:
            - img "Diagram representing how an expensive shuffle operation is avoided automatically if two DataFrames are already aligned before joining." [ref=e140]
          - paragraph [ref=e142]:
            - emphasis [ref=e143]: Both joins are performed on the same column. The left DataFrame is already properly partitioned after the first join, so Dask can avoid shuffling again with the new implementation.
        - paragraph [ref=e144]:
          - text: The optimizer will determine when shuffling is necessary versus when a trivial join is sufficient because the data is already aligned properly. This can make individual merges an order of magnitude faster. This also applies to other operations that normally require a shuffle like
          - code [ref=e145]: groupby().apply()
          - text: .
        - paragraph [ref=e146]: Dask merges used to be inefficient, which caused long runtimes. The optimizer fixes this for the trivial case where these operations happen after each other, but the technique isn’t very advanced yet. There is still a lot of potential for improvement.
        - figure "The current implementation shuffles both branches that originate from the same table. Injecting a shuffle node further up avoids one of the expensive operations." [ref=e147]:
          - paragraph [ref=e148]:
            - img "Diagram showing how the query optimizer for Dask DataFrame automatically shuffles data earlier to make a groupby aggregation more efficient." [ref=e149]
          - paragraph [ref=e151]:
            - emphasis [ref=e152]: The current implementation shuffles both branches that originate from the same table. Injecting a shuffle node further up avoids one of the expensive operations.
        - paragraph [ref=e153]: The optimizer will look at the expression and inject shuffle nodes where necessary to avoid unnecessary shuffles.
        - heading "How do the improvements stack up compared to the legacy implementation?" [level=2] [ref=e154]
        - paragraph [ref=e155]: Dask is now 20x faster than before. This improvement applies to the entire DataFrame API (not just isolated components), with no known performance regressions. Dask now runs workloads that were impossible to complete in an acceptable timeframe before. This performance boost is due to many improvements all layered on top of each other. It’s not about doing one thing especially well, but about doing nothing especially poorly.
        - figure "Performance Improvements on Query 3 of the TPC-H Benchmarks from https://github.com/coiled/benchmarks/tree/main/tests/tpch" [ref=e156]:
          - paragraph [ref=e157]:
            - img "Bar chart showing a nearly 20x improvement in Dask DataFrame performance with the addition of Arrow stings, more efficient shufffling, and a query optimizer." [ref=e158]
          - paragraph [ref=e160]:
            - emphasis [ref=e161]:
              - text: Performance Improvements on Query 3 of the TPC-H Benchmarks from
              - link "https://github.com/coiled/benchmarks/tree/main/tests/tpch" [ref=e162] [cursor=pointer]:
                - /url: https://github.com/coiled/benchmarks/tree/main/tests/tpch
        - paragraph [ref=e163]: Performance, while the most enticing improvement, is not the only thing that got better. The optimizer hides a lot of complexity from the user and makes the transition from pandas to Dask a lot easier because it’s now much more difficult to write poorly performing code. The whole system is more robust.
        - paragraph [ref=e164]: The new architecture of the API is a lot easier to work with as well. The legacy implementation leaked a lot of internal complexities into high-level API implementations, making changes cumbersome. Improvements are almost trivial to add now.
        - heading "What’s to come?" [level=2] [ref=e165]
        - paragraph [ref=e166]: Dask DataFrame changed a lot over the last 18 months. The legacy API was often difficult to work with and struggled with scaling out. The new implementation dropped things that didn’t work and improved existing implementations. The heavy lifting is finished now, which allows for faster iteration cycles to improve upon the status quo. Incremental improvements are now trivial to add.
        - paragraph [ref=e167]: "A few things that are on the immediate roadmap:"
        - list [ref=e168]:
          - listitem [ref=e169]:
            - strong [ref=e170]: "Auto repartitioning:"
            - text: this is partially implemented, but there is more potential to choose a more efficient partition size during optimization.
          - listitem [ref=e171]:
            - strong [ref=e172]: "Faster Joins:"
            - text: there’s still lots of fine-tuning to be done here. For example, there is a PR in flight with a 30-40% improvement.
          - listitem [ref=e173]:
            - strong [ref=e174]: "Join Reordering:"
            - text: Dask doesn’t do this yet, but it’s on the immediate roadmap
        - heading "Learn more" [level=2] [ref=e175]
        - paragraph [ref=e176]: "This article focuses on a number of improvements to Dask DataFrame and how much faster and more reliable it is as a result. If you’re choosing between Dask and other popular DataFrame tools, you might also consider:"
        - list [ref=e177]:
          - listitem [ref=e178]:
            - 'link "DataFrames at Scale Comparison: TPC-H" [ref=e179] [cursor=pointer]':
              - /url: https://docs.coiled.io/blog/tpch.html?utm_source=dask-blog&utm_medium=dask-is-fast
            - text: which compares Dask, Spark, Polars, and DuckDB performance on datasets ranging from 10 GB to 10 TB both locally and on the cloud
