{{ define "main" }}
<div class="container">
  <h1>{{ .Site.Title }}</h1>
  <p class="post-tagline">{{ .Site.Params.description }}</p>
  <ul class="post-list">
    {{- range where .Site.RegularPages "Section" "posts" }}
    <li>
      <span class="post-date">{{ .Date.Format "2006-01-02" }}</span>
      <span class="post-title"><a href="{{ .RelPermalink }}">{{ .Title }}</a></span>
    </li>
    {{- end }}
  </ul>
</div>
{{ end }}
